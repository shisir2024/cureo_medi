<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cureo — Patient Login</title>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <img src="logo.png" alt="Cureo" class="auth-logo"/>
        <h1>Cureo</h1>
        <p>Patient / Student Portal</p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required/>
        </div>
        <div id="loginError" class="error-msg"></div>
        <button type="submit" class="btn-submit">Login</button>
        <p class="back-link"><a href="landing.html">← Back to Home</a></p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" required/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="your@email.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="••••••••" required/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Age</label>
            <input type="text" id="regAge" placeholder="25"/>
          </div>
          <div class="form-group">
            <label>Sex</label>
            <select id="regSex">
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Medical History <span class="optional">(optional)</span></label>
          <input type="text" id="regHistory" placeholder="e.g. Diabetes, Hypertension"/>
        </div>
        <div id="registerError" class="error-msg"></div>
        <button type="submit" class="btn-submit">Create Account</button>
        <p class="back-link"><a href="landing.html">← Back to Home</a></p>
      </form>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.textContent = 'Logging in...'; btn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('userName', data.name);
        window.location.href = 'index.html';
      } catch(err) {
        document.getElementById('loginError').textContent = err.message;
        btn.textContent = 'Login'; btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.textContent = 'Creating...'; btn.disabled = true;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            age: document.getElementById('regAge').value,
            sex: document.getElementById('regSex').value,
            medical_history: document.getElementById('regHistory').value,
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('userName', data.name);
        window.location.href = 'index.html';
      } catch(err) {
        document.getElementById('registerError').textContent = err.message;
        btn.textContent = 'Create Account'; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
