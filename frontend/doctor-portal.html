<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cureo — Doctor Portal</title>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <img src="logo.png" alt="Cureo" class="auth-logo"/>
        <h1>Cureo</h1>
        <p>Doctor Portal</p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="doctor@email.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required/>
        </div>
        <div id="loginError" class="error-msg"></div>
        <button type="submit" class="btn-submit doctor">Login</button>
        <p class="back-link"><a href="landing.html">← Back to Home</a></p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Dr. Jane Smith" required/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="doctor@email.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="••••••••" required/>
        </div>
        <div class="form-group">
          <label>Specialization</label>
          <select id="regSpec" required>
            <option value="">Select Specialization</option>
          </select>
        </div>
        <div class="form-group">
          <label>License Number</label>
          <input type="text" id="regLicense" placeholder="MCI-XXXXX" required/>
        </div>
        <div class="form-group">
          <label>Doctor Secret Code</label>
          <input type="password" id="regCode" placeholder="Enter secret code" required/>
          <small style="color:#64748b">Contact Cureo admin for the secret code</small>
        </div>
        <div id="registerError" class="error-msg"></div>
        <button type="submit" class="btn-submit doctor">Register as Doctor</button>
        <p class="back-link"><a href="landing.html">← Back to Home</a></p>
      </form>
    </div>
  </div>

  <script>
    // Load specializations
    fetch('/api/doctor/specializations')
      .then(r => r.json())
      .then(data => {
        const sel = document.getElementById('regSpec');
        data.specializations.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s; opt.textContent = s;
          sel.appendChild(opt);
        });
      });

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.textContent = 'Logging in...'; btn.disabled = true;
      try {
        const res = await fetch('/api/doctor/login', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('userName', data.name);
        localStorage.setItem('specialization', data.specialization);
        window.location.href = 'doctor.html';
      } catch(err) {
        document.getElementById('loginError').textContent = err.message;
        btn.textContent = 'Login'; btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.textContent = 'Registering...'; btn.disabled = true;
      try {
        const res = await fetch('/api/doctor/register', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            specialization: document.getElementById('regSpec').value,
            license_number: document.getElementById('regLicense').value,
            secret_code: document.getElementById('regCode').value,
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('userName', data.name);
        localStorage.setItem('specialization', data.specialization);
        window.location.href = 'doctor.html';
      } catch(err) {
        document.getElementById('registerError').textContent = err.message;
        btn.textContent = 'Register as Doctor'; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
